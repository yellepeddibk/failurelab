name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5.1.0
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pre-commit run --all-files
      - run: codespell

  type-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: mypy src

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest --junitxml=pytest-${{ matrix.python-version }}.xml
      - if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            .coverage
            coverage.xml
            pytest-*.xml

  cross-platform-smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: '3.14'
      - run: python -m pip install -e ".[dev]"
      - run: failurelab --version
      - run: failurelab --help

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: '3.14'
      - run: python -m pip install -e ".[dev]"
      - run: python -m build
      - run: twine check dist/*
      - run: check-wheel-contents dist/*.whl
      - run: |
          python -m venv /tmp/failurelab-wheel-smoke
          /tmp/failurelab-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/failurelab-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/failurelab-wheel-smoke/bin/python -c "import failurelab; print(failurelab.__version__)"
          /tmp/failurelab-wheel-smoke/bin/failurelab --version
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: dist
          path: dist/

  docs-and-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: '3.14'
      - run: python -m pip install -e ".[dev]"
      - run: python -m json.tool .github/rulesets/protect-main.json > /dev/null
      - run: python -c "import yaml, pathlib; [yaml.safe_load(p.read_text()) for p in pathlib.Path('.').rglob('*.yml')]"

  security-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: '3.14'
      - run: python -m pip install -e ".[dev]"
      - run: |
          python -m venv /tmp/failurelab-audit
          /tmp/failurelab-audit/bin/python -m pip install --upgrade pip
          /tmp/failurelab-audit/bin/python -m pip install -e ".[dev]" pip-audit
          /tmp/failurelab-audit/bin/pip-audit
      - run: bandit -q -r src
      - run: |
          if grep -R -n --binary-files=without-match --exclude-dir=.git -E -- "-----BEGIN [A-Z ]*PRIVATE K[E]Y-----" .; then
            echo "Potential private key material detected."
            exit 1
          fi

  quality-gate:
    if: always()
    needs: [lint, type-check, tests, cross-platform-smoke, build, docs-and-metadata, security-check]
    runs-on: ubuntu-latest
    steps:
      - run: |
          failed=0
          for result in "${{ needs.lint.result }}" "${{ needs.type-check.result }}" "${{ needs.tests.result }}" "${{ needs.cross-platform-smoke.result }}" "${{ needs.build.result }}" "${{ needs.docs-and-metadata.result }}" "${{ needs.security-check.result }}"; do
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "quality-gate failed"; exit 1
          fi
          echo "quality-gate passed"
