name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pre-commit run --all-files
      - run: codespell

  type-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: mypy src

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest --junitxml=pytest-${{ matrix.python-version }}.xml
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            .coverage
            coverage.xml
            pytest-*.xml

  cross-platform-smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - run: python -m pip install -e ".[dev]"
      - run: failurelab --version
      - run: failurelab --help

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - run: python -m pip install -e ".[dev]"
      - run: python -m build
      - run: twine check dist/*
      - run: check-wheel-contents dist/*.whl
      - run: |
          python -m venv /tmp/failurelab-wheel-smoke
          /tmp/failurelab-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/failurelab-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/failurelab-wheel-smoke/bin/python -c "import failurelab; print(failurelab.__version__)"
          /tmp/failurelab-wheel-smoke/bin/failurelab --version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dist
          path: dist/

  docs-and-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - run: python -m pip install -e ".[dev]"
      - run: python -c "import yaml, pathlib; [yaml.safe_load(p.read_text()) for p in pathlib.Path('.').rglob('*.yml')]"

  security-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - run: python -m pip install -e ".[dev]"
      - run: |
          python -m venv /tmp/failurelab-audit
          /tmp/failurelab-audit/bin/python -m pip install --upgrade pip
          /tmp/failurelab-audit/bin/python -m pip install -e ".[dev]" pip-audit
          /tmp/failurelab-audit/bin/pip-audit
      - run: bandit -q -r src
      - run: |
          if grep -R -n --binary-files=without-match --exclude-dir=.git -E -- "-----BEGIN [A-Z ]*PRIVATE K[E]Y-----" .; then
            echo "Potential private key material detected."
            exit 1
          fi

  quality-gate:
    if: always()
    needs: [lint, type-check, tests, cross-platform-smoke, build, docs-and-metadata, security-check]
    runs-on: ubuntu-latest
    steps:
      - run: |
          failed=0
          for result in "${{ needs.lint.result }}" "${{ needs.type-check.result }}" "${{ needs.tests.result }}" "${{ needs.cross-platform-smoke.result }}" "${{ needs.build.result }}" "${{ needs.docs-and-metadata.result }}" "${{ needs.security-check.result }}"; do
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "quality-gate failed"; exit 1
          fi
          echo "quality-gate passed"
