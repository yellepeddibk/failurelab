[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "failurelab"
version = "0.2.0"
description = "Deterministic AI reliability analysis for RAG and agent traces"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.15"
authors = [{ name = "FailureLab contributors" }]
keywords = ["rag", "ai", "reliability", "evaluation", "testing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "typer>=0.12.3",
  "rich>=13.7.1",
  "pydantic>=2.8.2,<3",
  "PyYAML>=6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "pytest-cov>=5.0.0",
  "hypothesis>=6.112.1",
  "mypy>=1.11.1",
  "ruff>=0.6.2",
  "pre-commit>=3.8.0",
  "build>=1.2.2",
  "twine>=5.1.1",
  "check-wheel-contents>=0.6.0",
  "pip-audit>=2.7.3",
  "bandit>=1.7.9",
  "codespell>=2.3.0",
]

[project.scripts]
failurelab = "failurelab.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/failurelab"]
core-metadata-version = "2.3"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.3"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=failurelab --cov-branch --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
omit = [
  "src/failurelab/__main__.py",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "UP", "PT", "N", "ANN", "RUF"]
ignore = ["ANN401", "B008", "E501", "PT018", "RUF012", "UP012", "UP017"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "PT011"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

[tool.codespell]
skip = ".git,.venv,*.lock"
